<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>akadeMy - Enrollment</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <nav1>
    <div class="logo">KM academy</div>
    <div class="nav1-links">
      <a href="#">Home</a>
      <a href="#" class="active">Courses</a>
      <a href="#">Teachers</a>
      <a href="#">Support</a>
    </div>
    <div class="nav1-right">
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">dark</button>
      
    </div>
  </nav1>

  <div class="content-area">
    <section class="intro">
      <div class="intro-text">
        <h1><span>now</span> you can enroll your courses, <span>let's go!!</span></h1>
        <p>Start your journey and enroll in our advanced courses.</p>
      </div>
    </section>

    <div class="main">
      <div class="form-card">
        <div class="form-title">Your Registration</div>
        <div class="form-sub">Start your journey with us .</div>

        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName">
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email">
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="phone">
        </div>

        <button type="get started" onclick="saveData()">get srarted </button>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
